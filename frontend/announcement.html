<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<title>Announcement - Civic Events</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/media-utils.js"></script>
<script>requireAuth();</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="site-header" class="h-16"></header>
<main id="main-content" class="mx-auto w-full max-w-6xl px-4 py-8 sm:py-10">
  <a href="announcements.html" class="text-sm text-brand-700 underline">&larr; All announcements</a>
  <div id="state" class="mt-3"></div>
  <article id="view" class="hidden mt-3 space-y-4 rounded-md bg-white border border-gray-200 p-5">
    <h1 id="title" class="text-3xl font-extrabold tracking-tight"></h1>
    <p id="meta" class="text-sm text-slate-600"></p>
    <!-- Native <audio> (no controls) is driven by the accessible custom player below. -->
    <audio id="audio" preload="metadata">
      Your browser can't play this audio. <a id="fallback" href="#">Download it</a>.
    </audio>
    <div role="group" aria-label="Audio player" class="rounded bg-mint border border-gray-200 p-3 space-y-2">
      <div class="flex items-center gap-3">
        <button id="pp" type="button" class="btn-primary" aria-label="Play">Play</button>
        <span class="text-sm tabular-nums"><span id="cur">0:00</span> / <span id="tot">0:00</span></span>
      </div>
      <label for="seek" class="sr-only">Seek</label>
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" class="w-full" aria-valuetext="0:00 of 0:00">
      <p class="text-xs text-slate-500">Keyboard: Space or K to play/pause, Left/Right arrows to seek 5 seconds.</p>
    </div>
    <a id="dl" class="btn-secondary inline-block" download>Download audio</a>
  </article>
</main>
<footer id="site-footer"></footer>
<script>
$(function () {
  var id = new URLSearchParams(location.search).get("id");
  if (!id) return $("#state").html(UI.emptyState("No announcement selected", "Pick one from the list."));
  var au = $("#audio")[0], $pp = $("#pp"), $seek = $("#seek");

  function sync() {
    var d = au.duration, c = au.currentTime;
    $("#cur").text(Media.fmtTime(c)); $("#tot").text(Media.fmtTime(d));
    if (isFinite(d) && d > 0) $seek.val(c / d * 100);
    $seek.attr("aria-valuetext", Media.fmtTime(c) + " of " + Media.fmtTime(d));
  }
  function toggle() {
    if (au.paused) au.play().catch(function () { UI.toast("Couldn't play this audio.", "error"); });
    else au.pause();
  }
  function skip(s) { if (isFinite(au.duration)) au.currentTime = Math.min(au.duration, Math.max(0, au.currentTime + s)); }

  $pp.on("click", toggle);
  $(au).on("play pause ended", function () { var p = !au.paused; $pp.text(p ? "Pause" : "Play").attr("aria-label", p ? "Pause" : "Play"); })
       .on("timeupdate loadedmetadata durationchange", sync)
       .on("error", function () { UI.toast("This audio couldn't be loaded.", "error"); $pp.prop("disabled", true); });
  $seek.on("input", function () { if (isFinite(au.duration)) au.currentTime = this.value / 100 * au.duration; });

  // Keyboard shortcuts; skip when typing in fields or when a button/link has native Space/Enter behaviour.
  $(document).on("keydown", function (e) {
    var $t = $(e.target);
    if ($t.is("input:not([type=range]),textarea,select,a,button")) return;
    if (e.key === " " || e.key.toLowerCase() === "k") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowLeft" && !$t.is($seek)) skip(-5);
    else if (e.key === "ArrowRight" && !$t.is($seek)) skip(5);
  });

  function load() {
    $("#state").html(UI.skeleton(1));
    Api.get("/announcements/" + encodeURIComponent(id)).done(function (res) {
      var a = res.data;
      if (!Media.visible(a)) return $("#state").html(UI.emptyState("Not available", "This announcement isn't published."));
      $("#state").empty(); $("#view").removeClass("hidden");
      document.title = a.title + " - Civic Events";
      $("#title").text(a.title);
      // ROLE GUARD: Draft badge for admins only (Media.visible hides unpublished items from users).
      if (isAdmin() && a.published === false) $("#title").append('<span class="ml-2 align-middle text-xs font-medium rounded bg-[#FDF1DC] text-gold-700 px-2 py-0.5">Draft</span>');
      $("#meta").text("Posted " + Media.fmtDate(a.created_at));
      var src = Media.url(a.audio_url);
      au.src = src; $("#fallback,#dl").attr("href", src);
    }).fail(function (err) { UI.errorState($("#state"), err.message, load); });
  }
  load();
});
</script>
</body>
</html>
