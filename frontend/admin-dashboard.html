<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<title>Admin Dashboard - Civic Events</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/admin-nav.js"></script>
<!-- ROLE GUARD: admin only (non-admins -> dashboard.html). UX only; GET /dashboard/admin is admin-protected server-side. -->
<script>requireAdmin();</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="site-header" class="h-16"></header>
<main id="main-content" class="mx-auto w-full max-w-6xl px-4 py-8 sm:py-10">
  <div id="admin-shell" class="flex flex-col md:flex-row gap-6">
    <div class="flex-1 min-w-0 space-y-6">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-3xl font-extrabold tracking-tight">Admin dashboard</h1>
        <button id="refresh" type="button" class="btn-secondary">Refresh</button>
      </div>
      <p id="updated" class="text-xs text-slate-500" aria-live="polite"></p>
      <div id="content" aria-live="polite"></div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script>
$(function () {
  AdminNav.mount("admin-dashboard.html");
  var n = function (v) { return Number(v) || 0; };

  function skeleton() {
    var c = '<div class="animate-pulse rounded-md bg-white border border-gray-200 p-4"><div class="h-3 bg-slate-200 rounded w-1/2 mb-3"></div><div class="h-7 bg-slate-200 rounded w-1/3"></div></div>';
    $("#content").html('<div aria-busy="true" aria-label="Loading" class="grid gap-4 grid-cols-2 lg:grid-cols-4">' + c.repeat(8) + "</div>");
  }

  function card(label, value) {
    return '<div class="rounded-md bg-white border border-gray-200 p-4"><p class="text-sm text-slate-600">' + UI.escapeHtml(label) +
      '</p><p class="text-3xl font-extrabold tracking-tight mt-1">' + n(value) + "</p></div>";
  }

  // Accessible chart wrapper: SVG is role=img with a summary; real numbers live in a visually hidden table.
  function chartBox(title, desc, svg, rows) {
    var t = rows.map(function (r) { return "<tr><th scope='row'>" + UI.escapeHtml(r[0]) + "</th><td>" + r[1] + "</td></tr>"; }).join("");
    return '<figure class="rounded-md bg-white border border-gray-200 p-4"><figcaption class="font-medium mb-3">' + UI.escapeHtml(title) + "</figcaption>" +
      '<div role="img" aria-label="' + UI.escapeHtml(desc) + '">' + svg + "</div>" +
      '<table class="sr-only"><caption>' + UI.escapeHtml(title) + "</caption><thead><tr><th>Label</th><th>Value</th></tr></thead><tbody>" + t + "</tbody></table></figure>";
  }

  function barChart(rows, color) {
    var max = Math.max.apply(null, rows.map(function (r) { return r[1]; }).concat(1));
    var w = 100 / rows.length, out = "";
    rows.forEach(function (r, i) {
      var h = r[1] / max * 90;
      out += '<rect x="' + (i * w + w * 0.15) + '" y="' + (100 - h - 8) + '" width="' + w * 0.7 + '" height="' + h + '" rx="1" fill="' + color + '"/>' +
        '<text x="' + (i * w + w / 2) + '" y="' + (100 - h - 10) + '" font-size="5" text-anchor="middle" fill="#334155">' + r[1] + "</text>" +
        '<text x="' + (i * w + w / 2) + '" y="98" font-size="4.5" text-anchor="middle" fill="#64748b">' + UI.escapeHtml(r[0]) + "</text>";
    });
    return '<svg viewBox="0 0 100 100" class="w-full h-48" aria-hidden="true">' + out + "</svg>";
  }

  function donut(a, b, la, lb) {
    var tot = a + b, C = 2 * Math.PI * 40, da = tot ? a / tot * C : 0;
    return '<div class="flex items-center gap-4"><svg viewBox="0 0 100 100" class="w-40 h-40" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="40" fill="none" stroke="#cbd5e1" stroke-width="16"/>' +
      '<circle cx="50" cy="50" r="40" fill="none" stroke="#0F3D56" stroke-width="16" stroke-dasharray="' + da + " " + C + '" transform="rotate(-90 50 50)"/>' +
      '<text x="50" y="55" text-anchor="middle" font-size="16" fill="#0f172a">' + tot + "</text></svg>" +
      '<ul class="text-sm space-y-1"><li><span class="inline-block w-3 h-3 rounded-sm mr-2" style="background:#0F3D56"></span>' + la + ": " + a + "</li>" +
      '<li><span class="inline-block w-3 h-3 rounded-sm mr-2" style="background:#cbd5e1"></span>' + lb + ": " + b + "</li></ul></div>";
  }

  function render(d) {
    var u = d.users || {}, e = d.events || {};
    var cards = [["Total users", u.total_users], ["Active users", u.active_users], ["Inactive users", u.inactive_users],
      ["Total events", e.total_events], ["Upcoming events", e.upcoming_events], ["Past events", e.past_events],
      ["Registrations", (d.registrations || {}).total_registrations], ["Feedback", (d.feedbacks || {}).total_feedback],
      ["Promos", (d.promos || {}).total_promos], ["Announcements", (d.announcements || {}).total_announcements],
      ["Notifications", (d.notifications || {}).total_notifications]];
    var growth = (d.user_growth || []).map(function (r) { return [r.month, n(r.new_users)]; });
    var up = n(e.upcoming_events), past = n(e.past_events), act = n(u.active_users), ina = n(u.inactive_users);

    var html = '<div class="grid gap-4 grid-cols-2 lg:grid-cols-4">' + cards.map(function (c) { return card(c[0], c[1]); }).join("") + "</div>" +
      '<div class="grid gap-4 lg:grid-cols-2 mt-6">' +
      chartBox("New users per month", "Bar chart of new users per month: " + (growth.map(function (r) { return r[0] + " " + r[1]; }).join(", ") || "no data"),
        growth.length ? barChart(growth, "#0F3D56") : '<p class="text-sm text-slate-500">No signups in the last 6 months.</p>', growth) +
      chartBox("Upcoming vs past events", "Donut chart: " + up + " upcoming, " + past + " past events",
        donut(up, past, "Upcoming", "Past"), [["Upcoming", up], ["Past", past]]) +
      chartBox("Active vs inactive users", "Bar chart: " + act + " active, " + ina + " inactive users",
        barChart([["Active", act], ["Inactive", ina]], "#1BA3A3"), [["Active", act], ["Inactive", ina]]) + "</div>";
    $("#content").html(html);
    $("#updated").text("Last updated " + new Date().toLocaleTimeString());
  }

  function load(silent) {
    if (!silent) skeleton();
    // ROLE GUARD: admin stats endpoint (admin-only on the server).
    Api.get("/dashboard/admin", null, { silent: !!silent }).done(function (res) { render(res.data || {}); })
      .fail(function (err) { if (!silent) UI.errorState($("#content"), err.message, load); });
  }

  $("#refresh").on("click", function () { load(false); });
  load(false);
  setInterval(function () { if (!document.hidden) load(true); }, 60000); // auto refresh; failures keep the last good data
});
</script>
</body>
</html>
